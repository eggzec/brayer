name: Code Test

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:
  workflow_call:
    outputs:
      artifact_name:
        value: ${{ jobs.fresh_build.outputs.artifact_name }}
      artifact_run_id:
        value: ${{ jobs.fresh_build.outputs.run_id }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt needs a platform plugin even with no display attached. "offscreen"
  # renders into memory, so the whole widget suite runs on a headless
  # runner without xvfb.
  QT_QPA_PLATFORM: offscreen
  # Keep the "could not connect to display" chatter out of the logs.
  QT_LOGGING_RULES: "qt.qpa.*=false"

jobs:

  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Supported Python
        id: fetch-versions
        run: |
          # Without pipefail this pipeline reports jq's exit status, not
          # curl's, so a network failure is masked: jq reads empty input,
          # emits [], and the matrix expands to zero jobs. The dependent job
          # then never gets created and the run fails with no failing step.
          set -euo pipefail

          versions=$(curl -fsSL --proto '=https' --proto-redir '=https' \
                       --retry 3 --retry-all-errors --connect-timeout 15 \
                       https://endoflife.date/api/v1/products/python/ \
                     | jq -c '[ .result.releases[] | select(.isEol == false) | .label ]')

          if [ "$(echo "$versions" | jq 'length')" -eq 0 ]; then
            echo "::error::endoflife.date returned no supported Python versions"
            exit 1
          fi

          echo "supported_versions=$versions"                              >> $GITHUB_OUTPUT
          echo "bound_versions=$(echo "$versions" | jq -c '[.[0],.[-1]]')" >> $GITHUB_OUTPUT

    outputs:
      supported_versions: ${{ steps.fetch-versions.outputs.supported_versions }}
      bound_versions: ${{ steps.fetch-versions.outputs.bound_versions }}

  fresh_build:
    uses: ./.github/workflows/dist_build.yml

  testing:
    runs-on: ${{ matrix.os }}

    # A hung modal dialog would otherwise sit here until GitHub's own
    # 360-minute ceiling. Twenty minutes is far more than the suite needs.
    timeout-minutes: 20

    permissions:
      id-token: write  # for working of oidc of codecov

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        py-version: ${{ fromJson(needs.setup.outputs.supported_versions) }}
        include:
          - os: windows-latest
            py-version: ${{ fromJson(needs.setup.outputs.bound_versions)[0] }}
          - os: windows-latest
            py-version: ${{ fromJson(needs.setup.outputs.bound_versions)[1] }}
          - os: macos-latest
            py-version: ${{ fromJson(needs.setup.outputs.bound_versions)[0] }}
          - os: macos-latest
            py-version: ${{ fromJson(needs.setup.outputs.bound_versions)[1] }}

    needs:
      - fresh_build
      - setup

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          # PySide6 links these even under the offscreen platform plugin.
          # Without them `import PySide6.QtWidgets` fails at load time with
          # a bare ImportError that says nothing about the missing .so.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.fresh_build.outputs.artifact_name }}
          run-id: ${{ needs.fresh_build.outputs.run_id }}
          path: ./dist

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.py-version }}

      - name: Install Packages
        shell: bash
        run: |
          uv sync --no-dev --group test
          uv pip install -v ./dist/*.whl

      - name: Verify Qt imports headlessly
        shell: bash
        run: |
          # Fail here, with a readable message, rather than inside four
          # parallel xdist workers whose crash output is interleaved.
          uv run --no-sync python -c "
          from PySide6 import QtWidgets
          app = QtWidgets.QApplication([])
          print('Qt OK:', QtWidgets.QLabel('probe').text())
          "

      - name: Run Tests
        shell: bash
        # The source tree is deleted first so the tests can only import the
        # installed wheel. Otherwise `src/` shadows it and a packaging bug
        # -- a missing __init__.py, a file left out of the wheel -- passes
        # CI and only breaks for users.
        run: |
          rm -rf src
          uv run --no-sync pytest -v -n auto --cov --cov-report=xml tests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          use_oidc: true
          verbose: true
