[build-system]
requires = ["hatchling>=1.32.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "brayer"
dynamic = ["version"]
description = "Turn a Pydantic model into a desktop form: declare the shape, get a validated object back"
authors = [
    { name = "M Laraib Ali", email = "laraibg786@outlook.com" },
]
maintainers = [
    { name = "Saud Zahir", email = "m.saud.zahir@gmail.com" },
    { name = "M Laraib Ali", email = "laraibg786@outlook.com" }
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = [
    "pydantic",
    "gui",
    "form",
    "dialog",
    "qt",
    "pyside6",
    "desktop",
    "data entry",
    "schema",
    "validation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
dependencies = [
    "pydantic>=2.7",
    "pyside6-essentials>=6.7",
]
requires-python = ">=3.10"

[project.scripts]
brayer = "brayer._cli:main"

[project.urls]
homepage = "https://eggzec.github.io/brayer/"
documentation = "https://eggzec.github.io/brayer/"
source = "https://github.com/eggzec/brayer"
changelog = "https://eggzec.github.io/brayer/changelog/"
releasenotes = "https://github.com/eggzec/brayer/releases/latest"
issues = "https://github.com/eggzec/brayer/issues"

[dependency-groups]
dev = [
  {include-group = "docs"},
  {include-group = "lint"},
  {include-group = "test"}
]
docs = [
    "zensical>=0.0.53"
]
lint = [
    "ruff==0.16.*",
]
test = [
    "pytest>=8.3",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.8",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/brayer"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/tools", "/README.md", "/LICENSE"]

[tool.ruff]
# CI workflow definitions and the helper scripts they run are not
# part of the published package, so they are out of scope here.
extend-exclude = [".github"]
line-length = 80
indent-width = 4
preview = true

# Output serialization format for violations. The default serialization
# format is "full" [env: RUFF_OUTPUT_FORMAT=] [possible values:
# concise, full, json, json-lines, junit, grouped, github, gitlab,
# pylint, rdjson, azure, sarif]
output-format = "grouped"

[tool.ruff.lint]
isort.lines-after-imports = 2
isort.split-on-trailing-comma = false

select = [
    "ANN", # flake8-annotations (required strict type annotations for public functions)
    "S",   # flake8-bandit (checks basic security issues in code)
    "BLE", # flake8-blind-except (checks the except blocks that do not specify exception)
    "FBT", # flake8-boolean-trap (ensure that boolean args can be used with kw only)
    "E",   # pycodestyle errors (PEP 8 style guide violations)
    "W",   # pycodestyle warnings (e.g., extra spaces, indentation issues)
    "DOC", # pydoclint issues (e.g., extra or missing return, yield, warnings)
    "A",   # flake8-buitins (check variable and function names to not shadow builtins)
    "N",   # Naming convention checks (e.g., PEP 8 variable and function names)
    "F",   # Pyflakes errors (e.g., unused imports, undefined variables)
    "I",   # isort (Ensures imports are sorted properly)
    "B",   # flake8-bugbear (Detects likely bugs and bad practices)
    "TID", # flake8-tidy-imports (Checks for banned or misplaced imports)
    "UP",  # pyupgrade (Automatically updates old Python syntax)
    "YTT", # flake8-2020 (Detects outdated Python 2/3 compatibility issues)
    "FLY", # flynt (Converts old-style string formatting to f-strings)
    "PIE", # flake8-pie
    "PL",  # pylint
    "RUF", # Ruff-specific rules (Additional optimizations and best practices)
]

ignore = [
    # docstring-extraneous-exception. This project documents exceptions
    # that PROPAGATE out of a call, not only those raised in the
    # function body itself -- `ask()` really can raise
    # UnsupportedTypeError, and a caller needs to know that even though
    # the raise happens two frames down. Deleting those Raises sections
    # to satisfy the rule would make the API docs less accurate.
    "docstring-extraneous-exception",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["non-empty-init-module"]
"tests/*.py" = [
    "missing-type-function-argument",
    "missing-return-type-undocumented-public-function",
    "missing-return-type-private-function",
    "undocumented-public-function",
    "assert",
    "no-self-use",
    "magic-value-comparison",
    # A test that exercises one module imports it in the test body, so
    # the reader sees what is under test without scrolling to the header.
    "import-outside-top-level",
    # Reaching into private modules is the point: these tests pin down
    # internal behaviour that the public surface only exposes indirectly.
    "import-private-name",
    # The constants compared here are exactly representable, and an
    # approx() wrapper would hide which value the assertion means.
    "float-equality-comparison",
    # typing.Union / typing.Optional appear on purpose here: the
    # dispatcher must handle both spellings, so the tests cannot all
    # be written with the PEP 604 pipe.
    "non-pep604-annotation-union",
    "non-pep604-annotation-optional",
    "unused-noqa",
]
"tools/*.py" = [
    # Asset generation is a developer script, not shipped code: it
    # reports progress on stdout, keeps the Qt import inside the one
    # function that rasterises, and carries the geometry of a layout in
    # local variables.
    "print",
    "import-outside-top-level",
    "too-many-branches",
    "too-many-locals",
    "boolean-positional-value-in-call",
    "zip-without-explicit-strict",
    "magic-value-comparison",
]

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers --strict-config"
# Note: Qt needs a platform plugin even with no display attached.
# tests/conftest.py sets QT_QPA_PLATFORM=offscreen before PySide6 is
# imported, so the suite runs identically for every developer and every
# CI leg without depending on a shell export that is easy to forget.

[tool.coverage.run]
branch = true
source = ["brayer"]

[tool.coverage.paths]
# Maps the installed wheel back onto the source tree, so coverage
# measured against the installed package is reported against src/.
source = ["src/brayer", "*/site-packages/brayer"]

[tool.coverage.report]
exclude_also = [
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
    "@typing.overload",
]
